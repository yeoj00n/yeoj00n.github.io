<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제목 글씨체 미리보기</title>
<style>
@font-face{font-family:'PV-Fromsol';src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607161334@griun-fromsol-rg/griun-fromsol-rg/Griun_Fromsol-Rg.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'PV-Cocochoitoon';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-1@1.0/Griun_Cocochoitoon-Rg.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'PV-Yuntaeng';src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/%EC%98%A8%EA%B8%80%EC%9E%8E%20%EC%9C%A4%ED%83%B1%EC%B2%B4.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'PV-Chilpan';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimChilpanjiugaeTTF-B.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'PV-Ochungi';src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607161334@griunxhangeulochungikim-regular/griunxhangeulochungikim-regular/GriunXHangeulOCHUNGIKIM-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f3f3f3;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:#222}
.wrap{max-width:420px;margin:0 auto}
h1{font-size:20px;margin:4px 0 2px}
.note{font-size:13px;color:#666;margin:0 0 16px}
.label{display:inline-block;background:#fff;color:#222;font-size:15px;padding:6px 10px;border-radius:8px;margin:14px 0 6px}
.card{height:300px;border-radius:16px;background:linear-gradient(rgba(0,0,0,.18),transparent 60%),url(cover-bg2.jpg) center 30%/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.28)}
.sub{font-size:18px;margin-bottom:10px}
.title{font-size:46px;line-height:1.15}
.cov{font-size:12px;color:#888;margin:6px 2px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>제목 글씨체 미리보기</h1>
<p class="note">(미리보기용 임시 페이지)</p>
<div id="list"></div>
</div>
<script>
var FONTS=[
 {ko:'그리운 프롬솔',en:'Griun Fromsol',f:'PV-Fromsol',w:400},
 {ko:'그리운 코코초이툰',en:'Griun Cocochoitoon',f:'PV-Cocochoitoon',w:400},
 {ko:'온글잎 윤탱체',en:'Ownglyph Yuntaeng',f:'PV-Yuntaeng',w:400},
 {ko:'학교안심 칠판지우개',en:'Hakgyoansim Chilpanjiugae (700)',f:'PV-Chilpan',w:700},
 {ko:'그리운 국한박 오춘기 김작가',en:'Griun X Hangeul Ochungi.Kim',f:'PV-Ochungi',w:400}
];
var SUB="Baby's 1st birthday",L1='여준이의',L2='첫번째 생일';
var list=document.getElementById('list');
FONTS.forEach(function(o,i){
 list.insertAdjacentHTML('beforeend',
 '<div class="label">'+(i+1)+'. '+o.ko+' ('+o.en+')</div>'+
 '<div class="card" style="font-family:\''+o.f+'\',sans-serif;font-weight:'+o.w+'">'+
 '<div class="sub">'+SUB+'</div><div class="title">'+L1+'<br>'+L2+'</div></div>'+
 '<div class="cov" id="cov'+i+'">글자 확인 중…</div>');
});
function pix(ctx,ch,font){
 var c=ctx.canvas;ctx.clearRect(0,0,c.width,c.height);ctx.font=font;ctx.fillStyle='#000';ctx.textBaseline='alphabetic';
 ctx.fillText(ch,10,66);
 var d=ctx.getImageData(0,0,c.width,c.height).data,s='';
 for(var k=3;k<d.length;k+=4)s+=d[k]>127?'1':'0';
 return s;
}
function missing(o){
 var cv=document.createElement('canvas');cv.width=90;cv.height=90;
 var ctx=cv.getContext('2d',{willReadFrequently:true});
 var chars=Array.from(new Set((L1+L2+SUB).replace(/\s/g,'').split('')));
 var fbs=['serif','monospace','cursive'];
 // a glyph is missing when "font,fallback" renders exactly like the plain fallback for every fallback family
 return chars.filter(function(ch){
  return fbs.every(function(fb){return pix(ctx,ch,o.w+' 64px "'+o.f+'",'+fb)===pix(ctx,ch,'400 64px '+fb);});
 });
}
Promise.all(FONTS.map(function(o){return document.fonts.load(o.w+' 46px "'+o.f+'"',L1+L2+SUB).catch(function(){});})).then(function(){return document.fonts.ready;}).then(function(){
 FONTS.forEach(function(o,i){
  var el=document.getElementById('cov'+i);
  if(!document.fonts.check(o.w+' 46px "'+o.f+'"')|| !Array.from(document.fonts).some(function(f){return f.family.replace(/"/g,'')===o.f&&f.status==='loaded';})){el.textContent='폰트 불러오기 실패 - 확인 불가';return;}
  var m=missing(o);
  el.textContent=m.length?'없는 글자: '+m.join(' '):'제목 글자 모두 있음';
 });
});
</script>
</body>
</html>
