<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>돌잔치 초대장</title>
<style>
:root{--bg:#f4f9fd;--card:#ffffff;--ink:#35465a;--sub:#7a8ea3;--gold:#6fa8dc;--soft:#e3f0fa;--page:#dfe9f1;--line:#cfe0ee;--p1:#e8f3fb;--p2:#cfe5f5;--pc:#8fb0cc;--cv0:#b8d6ee;--cv1:#dcecf9;--cv2:#8fbfe6;--sh:47,111,176;--gl:80,140,200;--ac:111,168,220;--on:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--page);font-family:'Noto Serif KR','Apple SD Gothic Neo','Malgun Gothic',serif;color:var(--ink);line-height:1.8;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;overflow:hidden;position:relative;box-shadow:0 0 40px rgba(0,0,0,.08)}
section{padding:72px 28px;text-align:center;position:relative}
.eyebrow{font-family:Georgia,serif;letter-spacing:.3em;font-size:12px;color:var(--gold);margin-bottom:10px;text-transform:uppercase}
h2{font-weight:500;font-size:22px;margin-bottom:28px}
p{font-size:15px}
.photo{width:100%;background:linear-gradient(135deg,var(--p1),var(--p2));display:flex;align-items:center;justify-content:center;color:var(--pc);font-size:13px;overflow:hidden;border-radius:6px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
#cover{min-height:100vh;padding:0;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:var(--cv0)}
#cover .bg{position:absolute;inset:0;background:linear-gradient(160deg,var(--cv1),var(--cv2) 70%);overflow:hidden}
#cover .bg img{width:100%;height:100%;object-fit:cover;animation:zoom 14s ease-out forwards}
#cover .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(var(--sh),.65),rgba(var(--sh),0) 60%)}
#cover .txt{position:relative;z-index:2;padding:0 28px 150px}
#cover .small{font-family:Georgia,serif;letter-spacing:.35em;font-size:12px;opacity:0;animation:up 1.2s .4s forwards}
#cover h1{font-size:30px;font-weight:500;margin:10px 0;opacity:0;animation:up 1.2s .9s forwards}
#cover .when{font-size:14px;opacity:0;animation:up 1.2s 1.4s forwards}
#cover .scroll{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:2;font-size:11px;letter-spacing:.2em;color:#fff;opacity:.8;animation:bob 2s infinite}
@keyframes zoom{from{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
.float{position:absolute;bottom:-60px;z-index:1;opacity:0;animation:rise linear infinite;pointer-events:none}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.85}90%{opacity:.7}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.reveal{opacity:0;transform:translateY(32px);transition:opacity 1s ease,transform 1s ease}
.reveal.show{opacity:1;transform:none}
.reveal.d1{transition-delay:.15s}.reveal.d2{transition-delay:.3s}.reveal.d3{transition-delay:.45s}
.greet p{margin-bottom:14px}
.parents{margin-top:30px;color:var(--sub);font-size:14px}
.tl{position:relative;text-align:left;padding-left:26px;margin:0 6px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--gold);opacity:.5}
.tl .it{position:relative;margin-bottom:26px}
.tl .it:before{content:"";position:absolute;left:-26px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(var(--ac),.2)}
.tl .d{font-family:Georgia,serif;font-size:12px;color:var(--gold);letter-spacing:.1em}
.tl .t{font-size:15px}
.tl .photo{height:150px;margin-top:8px}
.cal{background:var(--card);border-radius:10px;padding:22px 16px;margin:0 0 28px;box-shadow:0 4px 20px rgba(var(--gl),.1)}
.cal .m{font-size:15px;margin-bottom:12px}
.cal table{width:100%;border-collapse:collapse;font-size:13px}
.cal th{color:var(--sub);font-weight:400;padding:6px 0}
.cal td{padding:8px 0}
.cal td.sun,.cal th:first-child{color:#d77}
.cal td.on span{display:inline-block;width:30px;height:30px;line-height:30px;border-radius:50%;background:var(--gold);color:var(--on);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(var(--ac),.5)}50%{box-shadow:0 0 0 9px rgba(var(--ac),0)}}
.count{display:flex;justify-content:center;gap:10px;margin-bottom:14px}
.count div{background:var(--card);border-radius:10px;width:66px;padding:12px 0;box-shadow:0 4px 14px rgba(var(--gl),.1)}
.count b{display:block;font-size:22px;font-weight:500;font-family:Georgia,serif}
.count small{font-size:10px;color:var(--sub);letter-spacing:.1em}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal>div:first-child{grid-column:span 2}
.gal .photo{aspect-ratio:3/4;cursor:pointer}
.gal>div:first-child .photo{aspect-ratio:4/3}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:99}
#lb img{max-width:94%;max-height:90%;border-radius:4px}
.fam{display:flex;justify-content:center;gap:14px}
.fam .c{width:30%}
.fam .photo{aspect-ratio:1/1;border-radius:50%;margin-bottom:10px}
.fam .n{font-size:15px}.fam .h{font-size:12px;color:var(--gold)}
.qa{background:var(--card);border-radius:10px;padding:18px 20px;margin-bottom:12px;text-align:left;box-shadow:0 4px 14px rgba(var(--gl),.08)}
.qa .q{font-size:12px;color:var(--gold);margin-bottom:2px}
.btns{display:flex;gap:8px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
.btn{border:1px solid var(--gold);background:transparent;color:var(--ink);padding:10px 18px;border-radius:30px;font-size:13px;font-family:inherit;text-decoration:none;cursor:pointer;display:inline-block}
.btn.fill{background:var(--gold);color:var(--on)}
.info{text-align:left;background:var(--card);border-radius:10px;padding:16px 20px;margin-top:12px;font-size:14px;box-shadow:0 4px 14px rgba(var(--gl),.08)}
.info b{display:block;font-weight:500;color:var(--gold);font-size:13px}
.acc{background:var(--card);border-radius:10px;padding:16px 20px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;text-align:left;box-shadow:0 4px 14px rgba(var(--gl),.08)}
.acc small{color:var(--sub);font-size:12px}
.acc .btn{padding:6px 14px}
form{text-align:left;background:var(--card);padding:22px;border-radius:10px;box-shadow:0 4px 14px rgba(var(--gl),.08)}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
form .btn{width:100%;margin-top:18px}
footer{padding:36px 20px 60px;font-size:12px;color:var(--sub);text-align:center}
#music{position:fixed;top:14px;right:14px;z-index:50;width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.8);font-size:16px;display:none;cursor:pointer}
</style>
</head>
<body>
<button id="music" aria-label="배경음악">♪</button>
<div id="app"></div>
<div id="lb"><img alt=""></div>

<script>
/* =====================================================
   여기만 고치면 돼요. 글자는 따옴표 안의 내용만 바꾸고,
   사진은 파일 이름이나 주소를 "" 안에 넣으면 됩니다.
   (예: "photos/1.jpg"  비워두면 빈 사진 자리로 보여요)
   예시로 들어 있는 이름, 날짜, 장소는 전부 가짜예요.
   색은 theme 에서 "blue"(하늘색), "yellow"(노랑), "beige"(베이지) 중에 고르세요.
   ===================================================== */
const CONFIG = {
  theme: "blue",
  babyName: "여준",
  title: "여준이의 첫번째 생일",
  date: "2027-01-30T11:00:00+09:00",
  dateText: "2027년 1월 30일 토요일 오전 11시",
  venue: "포포인츠 바이 쉐라톤 서울 구로 2층 PDR-C",
  address: "서울 구로구 디지털로32길 72",
  mapUrl: "",
  coverPhoto: "",
  greeting: [
    "작고 소중한 아이가 세상에 와서",
    "벌써 첫번째 생일을 맞았습니다.",
    "",
    "사랑과 응원 덕분에 건강하게 자랐어요.",
    "그 마음에 감사드리며 작은 자리를 마련했습니다.",
    "함께 오셔서 축복해 주세요."
  ],
  dad: "아빠 김철순", mom: "엄마 황다희",
  timelineTitle: "1년간의 성장 이야기",
  timeline: [
    { date: "2026.02.03", title: "세상에 첫 인사", photo: "" },
    { date: "2026.05.13", title: "100일 축하", photo: "" },
    { date: "2026.08.21", title: "200일의 축복", photo: "" },
    { date: "2027.02.03", title: "1ST BIRTHDAY", photo: "" }
  ],
  gallery: ["", "", "", "", "", ""],
  family: [
    { name: "김철순", tag: "#슈퍼맨", photo: "" },
    { name: "황다희", tag: "#사랑나무", photo: "" },
    { name: "김여준", tag: "#보물1호", photo: "" }
  ],
  about: [
    { q: "태명은?", a: "○○" },
    { q: "가장 좋아하는 장난감은?", a: "곰돌이 인형" },
    { q: "여준이에게 바라는 점", a: "건강하고 밝게 자라길 바라요." }
  ],
  info: [
    { title: "교통", text: "2호선 구로디지털단지역 2번 출구에서 도보 약 3분이에요." },
    { title: "주차", text: "호텔 지하 주차장을 이용할 수 있어요." },
    { title: "답례품", text: "참석해 주신 분들께 작은 선물을 준비했어요." },
    { title: "포토부스", text: "가족 사진을 남길 수 있는 공간이 있어요." }
  ],
  accounts: [
    { who: "김철순", bank: "은행", number: "000-0000-0000" },
    { who: "황다희", bank: "은행", number: "000-0000-0000" }
  ],
  phone: "",
  rsvpUrl: "",
  music: "",
  footer: "함께해 주셔서 감사합니다."
};
/* ===================== 아래는 건드리지 않아도 돼요 ===================== */
const THEMES = {
  blue: { bg: "#f4f9fd", card: "#ffffff", ink: "#35465a", sub: "#7a8ea3", gold: "#6fa8dc", soft: "#e3f0fa", page: "#dfe9f1", line: "#cfe0ee", p1: "#e8f3fb", p2: "#cfe5f5", pc: "#8fb0cc", cv0: "#b8d6ee", cv1: "#dcecf9", cv2: "#8fbfe6", sh: "47,111,176", gl: "80,140,200", ac: "111,168,220", on: "#ffffff" },
  yellow: { bg: "#fffbea", card: "#fffef7", ink: "#4d4430", sub: "#9a8c64", gold: "#f2b632", soft: "#fdf1c4", page: "#f3ecd2", line: "#efe2a9", p1: "#fff3c4", p2: "#fde39a", pc: "#c2a553", cv0: "#f6d56b", cv1: "#fff0b8", cv2: "#f4c542", sh: "178,127,0", gl: "150,115,20", ac: "242,182,50", on: "#4a3800" },
  beige: { bg: "#fbf7f0", card: "#fffdf8", ink: "#4a4038", sub: "#8a7d70", gold: "#c9a66b", soft: "#f1e6d3", page: "#e9e2d6", line: "#e3d8c4", p1: "#f3e8d4", p2: "#e8d9bd", pc: "#b3a283", cv0: "#d8c4a0", cv1: "#f3e6cc", cv2: "#d9bf92", sh: "140,105,55", gl: "120,95,50", ac: "201,166,107", on: "#ffffff" }
};
const C = CONFIG, $ = s => document.querySelector(s);
const themeName = new URLSearchParams(location.search).get("theme") || C.theme;
Object.entries(THEMES[themeName] || THEMES.blue).forEach(([k, v]) => document.documentElement.style.setProperty("--" + k, v));
const ph = (src, cls = "") => `<div class="photo ${cls}">${src ? `<img src="${src}" alt="" loading="lazy">` : "사진을 넣어주세요"}</div>`;
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const d = new Date(C.date);

function calendar() {
  const y = d.getFullYear(), m = d.getMonth(), first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  let h = `<div class="m">${y}년 ${m + 1}월</div><table><tr>${"일월화수목금토".split("").map(x => `<th>${x}</th>`).join("")}</tr><tr>`;
  for (let i = 0; i < first; i++) h += "<td></td>";
  for (let n = 1; n <= days; n++) {
    const w = (first + n - 1) % 7;
    h += `<td class="${w === 0 ? "sun" : ""} ${n === d.getDate() ? "on" : ""}"><span>${n}</span></td>`;
    if (w === 6 && n < days) h += "</tr><tr>";
  }
  return h + "</tr></table>";
}

$("#app").innerHTML = `
<section id="cover">
  <div class="bg">${C.coverPhoto ? `<img src="${C.coverPhoto}" alt="">` : ""}</div><div class="shade"></div>
  <div class="txt"><div class="small">FIRST BIRTHDAY</div><h1>${esc(C.title)}</h1><div class="when">${esc(C.dateText)}<br>${esc(C.venue)}</div></div>
  <div class="scroll">SCROLL</div>
</section>
<section class="greet"><div class="eyebrow reveal">Invitation</div><h2 class="reveal d1">초대합니다</h2>
  ${C.greeting.map((l, i) => `<p class="reveal d${i % 3 + 1}">${l ? esc(l) : "&nbsp;"}</p>`).join("")}
  <div class="parents reveal">${esc(C.dad)} · ${esc(C.mom)}</div></section>
<section style="background:var(--soft)"><div class="eyebrow reveal">Story</div><h2 class="reveal">${esc(C.timelineTitle)}</h2>
  <div class="tl">${C.timeline.map(t => `<div class="it reveal"><div class="d">${esc(t.date)}</div><div class="t">${esc(t.title)}</div>${ph(t.photo)}</div>`).join("")}</div></section>
<section><div class="eyebrow reveal">Birthday Date</div><h2 class="reveal">${esc(C.dateText)}</h2>
  <div class="cal reveal">${calendar()}</div>
  <div class="count reveal" id="count"></div><p id="cmsg" class="reveal" style="color:var(--sub);font-size:13px"></p></section>
<section style="background:var(--soft)"><div class="eyebrow reveal">Gallery</div><h2 class="reveal">우리의 순간들</h2>
  <div class="gal">${C.gallery.map((g, i) => `<div class="reveal d${i % 3 + 1}" data-i="${i}">${ph(g)}</div>`).join("")}</div></section>
<section><div class="eyebrow reveal">Introduction</div><h2 class="reveal">우리 가족을 소개합니다</h2>
  <div class="fam">${C.family.map((f, i) => `<div class="c reveal d${i + 1}">${ph(f.photo)}<div class="n">${esc(f.name)}</div><div class="h">${esc(f.tag)}</div></div>`).join("")}</div>
  <div style="margin-top:44px"><div class="eyebrow reveal">About Baby</div>
  ${C.about.map(a => `<div class="qa reveal"><div class="q">${esc(a.q)}</div>${esc(a.a)}</div>`).join("")}</div></section>
<section style="background:var(--soft)"><div class="eyebrow reveal">Location</div><h2 class="reveal">오시는 길</h2>
  <p class="reveal"><b>${esc(C.venue)}</b><br>${esc(C.address)}</p>
  <div class="btns reveal">${C.mapUrl ? `<a class="btn fill" href="${C.mapUrl}" target="_blank">지도 보기</a>` : ""}<button class="btn" data-copy="${esc(C.address)}">주소 복사</button></div>
  ${C.info.map(i => `<div class="info reveal"><b>${esc(i.title)}</b>${esc(i.text)}</div>`).join("")}</section>
<section><div class="eyebrow reveal">Gift</div><h2 class="reveal">마음 전하는 곳</h2>
  ${C.accounts.map(a => `<div class="acc reveal"><div><small>${esc(a.who)}</small><br>${esc(a.bank)} ${esc(a.number)}</div><button class="btn" data-copy="${esc(a.number)}">복사</button></div>`).join("")}</section>
<section style="background:var(--soft)"><div class="eyebrow reveal">R.S.V.P</div><h2 class="reveal">참석 여부</h2>
  ${C.rsvpUrl ? `<div class="reveal"><a class="btn fill" href="${C.rsvpUrl}" target="_blank">참석 여부 전달하기</a></div>` : `
  <form class="reveal" id="rsvp"><label>성함</label><input name="n" required>
  <label>참석 여부</label><select name="a"><option>참석할게요</option><option>아쉽지만 못 가요</option></select>
  <label>참석 인원</label><input name="c" type="number" min="1" value="1">
  <label>전하실 말씀</label><textarea name="m" rows="3"></textarea>
  <button class="btn fill" type="submit">문자로 전달하기</button></form>`}</section>
<footer>${esc(C.footer)}</footer>`;

const cv = $("#cover"), sy = ["🎈", "✨", "🤍", "⭐", "🎈"];
for (let i = 0; i < 12; i++) {
  const e = document.createElement("div"); e.className = "float"; e.textContent = sy[i % sy.length];
  e.style.left = Math.random() * 92 + "%"; e.style.fontSize = 16 + Math.random() * 18 + "px";
  e.style.animationDuration = 9 + Math.random() * 9 + "s"; e.style.animationDelay = Math.random() * 10 + "s";
  cv.appendChild(e);
}
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("show"); io.unobserve(x.target); } }), { threshold: .15 });
document.querySelectorAll(".reveal").forEach(e => io.observe(e));
function tick() {
  const s = Math.floor((d - new Date()) / 1000), msg = $("#cmsg");
  if (s < 0) { $("#count").innerHTML = ""; msg.textContent = "오늘을 함께해 주셔서 감사합니다."; return; }
  const v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60], l = ["DAYS", "HOURS", "MIN", "SEC"];
  $("#count").innerHTML = v.map((n, i) => `<div><b>${String(n).padStart(2, "0")}</b><small>${l[i]}</small></div>`).join("");
  msg.textContent = `${C.babyName}이의 생일파티가 ${v[0]}일 남았습니다.`;
}
tick(); setInterval(tick, 1000);
document.querySelectorAll(".gal [data-i]").forEach(e => e.onclick = () => {
  const src = C.gallery[e.dataset.i]; if (!src) return;
  $("#lb img").src = src; $("#lb").style.display = "flex";
});
$("#lb").onclick = () => $("#lb").style.display = "none";
document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
  const t = b.dataset.copy;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(() => {
    const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove();
  }).finally(() => { const o = b.textContent; b.textContent = "복사됨"; setTimeout(() => b.textContent = o, 1400); });
});
const f = $("#rsvp");
if (f) f.onsubmit = e => {
  e.preventDefault(); const v = new FormData(f);
  const body = `[${C.babyName} 돌잔치] ${v.get("n")} / ${v.get("a")} / ${v.get("c")}명 ${v.get("m") ? "/ " + v.get("m") : ""}`;
  if (!C.phone) { alert("받는 번호가 아직 설정되지 않았어요."); return; }
  location.href = `sms:${C.phone}?body=${encodeURIComponent(body)}`;
};
if (C.music) {
  const au = new Audio(C.music), mb = $("#music"); au.loop = true; mb.style.display = "block";
  mb.onclick = () => { if (au.paused) { au.play(); mb.textContent = "♪"; } else { au.pause(); mb.textContent = "×"; } };
  document.addEventListener("click", () => { if (au.paused && !au._t) { au._t = 1; au.play().catch(() => {}); } }, { once: true });
}
</script>
</body>
</html>
