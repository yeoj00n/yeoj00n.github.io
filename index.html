  au.addEventListener("pause", () => icon(false));
  mb.style.display = "flex";
  mb.addEventListener("click", () => {
    if (!au.paused && !userPaused) { userPaused = true; want = false; icon(false); fade(0, () => au.pause()); }
    else { userPaused = false; play().catch(() => {}); }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (!au.paused) { clearInterval(ft); au.pause(); } }
    else if (want && !userPaused && au.paused) play().catch(() => {});
  });
  play().then(unlisten).catch(() => {});
}
</script>
</body>
</html>
